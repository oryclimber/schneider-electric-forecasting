[project]
name = "schneider-electric-forecasting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Martin Lau", email = "martin.lau@hec.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "arch>=9.0.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "numpy>=2.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.14.4",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "D1"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D1"]
"scripts/*" = ["D1"]
